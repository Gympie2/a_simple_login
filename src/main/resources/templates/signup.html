<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up · Simple Log-in Page</title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body class="parchment-page">
<main class="auth-shell">
    <section class="auth-card" aria-labelledby="signup-title">
        <p class="eyebrow">Start simply</p>
        <h1 id="signup-title">Create your account</h1>
        <form th:action="@{/signup}" th:object="${registration}" method="post" class="auth-form" novalidate>
            <p class="notice error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">Please correct the form.</p>
            <label for="displayName">Display name</label>
            <input id="displayName" th:field="*{displayName}" autocomplete="name" required>
            <p class="field-error" th:errors="*{displayName}"></p>
            <label for="username">Username</label>
            <input id="username" th:field="*{username}" autocomplete="username" required>
            <p class="field-error" th:errors="*{username}"></p>
            <label for="email">Email address</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" required>
            <p class="field-error" th:errors="*{email}"></p>
            <label for="password">Password</label>
            <div class="password-field"><input id="password" type="password" th:field="*{password}" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false">Show</button></div>
            <p class="field-error" th:errors="*{password}"></p>
            <label for="confirmPassword">Confirm password</label>
            <div class="password-field"><input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-controls="confirmPassword" aria-pressed="false">Show</button></div>
            <p class="field-error" th:errors="*{confirmPassword}"></p>
            <button type="submit" class="button">Create account</button>
        </form>
        <p class="helper">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </section>
</main>
<script th:src="@{/js/password-visibility.js}" defer></script>
</body>
</html>
