<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Log-in Page</title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body class="parchment-page">
<main class="menu-shell">
    <section class="menu-card" aria-labelledby="menu-title">
        <p class="eyebrow">Signed in</p>
        <h1 id="menu-title">Simple Log-in Page</h1>
        <p class="intro">Welcome, <strong th:text="${currentUsername}">reader</strong>.</p>
        <div class="menu-line" aria-hidden="true"><span></span><span>✦</span><span></span></div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="button secondary">Log out</button>
        </form>
    </section>
</main>
</body>
</html>
