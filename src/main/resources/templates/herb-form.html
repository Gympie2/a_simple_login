<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${formTitle} + ' · Herb Catalogue'">Herb · Herb Catalogue</title><link rel="stylesheet" th:href="@{/css/application.css}"></head>
<body class="catalogue-page">
<header class="site-header"><div class="site-header-inner"><a class="site-brand" th:href="@{/catalogue}">Herb Catalogue</a><nav class="site-nav" aria-label="Main navigation"><a th:href="@{/admin/herbs}">Manage herbs</a><a th:href="@{/admin/categories}">Categories</a><a th:href="@{/admin/users}">Users</a><form th:action="@{/logout}" method="post"><button type="submit" class="link-button">Log out</button></form></nav></div></header>
<main class="content-shell form-content"><p class="back-link"><a th:href="@{/admin/herbs}">← Back to herbs</a></p><h1 th:text="${formTitle}">Add herb</h1>
    <form class="catalogue-form" th:action="${formAction}" th:object="${herbForm}" method="post">
        <p class="field-error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        <label for="name">Common name</label><input id="name" th:field="*{name}" maxlength="100"><p class="field-error" th:errors="*{name}"></p>
        <label for="botanicalName">Botanical name</label><input id="botanicalName" th:field="*{botanicalName}" maxlength="150"><p class="field-error" th:errors="*{botanicalName}"></p>
        <label for="categoryId">Category</label><select id="categoryId" th:field="*{categoryId}"><option value="">Choose a category</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Category</option></select><p class="field-error" th:errors="*{categoryId}"></p>
        <label for="description">Description</label><textarea id="description" th:field="*{description}" rows="7" maxlength="1200"></textarea><p class="field-error" th:errors="*{description}"></p>
        <button class="button" type="submit">Save herb</button>
    </form>
</main>
</body>
</html>
