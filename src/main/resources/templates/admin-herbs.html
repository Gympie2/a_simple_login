<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manage Herbs · Herb Catalogue</title><link rel="stylesheet" th:href="@{/css/application.css}"></head>
<body class="catalogue-page">
<header class="site-header"><div class="site-header-inner"><a class="site-brand" th:href="@{/catalogue}">Herb Catalogue</a><nav class="site-nav" aria-label="Main navigation"><a th:href="@{/catalogue}">Browse</a><a th:href="@{/notes}">My notes</a><a th:href="@{/admin/herbs}">Manage herbs</a><a th:href="@{/admin/categories}">Categories</a><a th:href="@{/admin/users}">Users</a><form th:action="@{/logout}" method="post"><button type="submit" class="link-button">Log out</button></form></nav></div></header>
<main class="content-shell"><div class="page-heading with-action"><div><h1>Manage herbs</h1><p>Add, edit, or remove catalogue records.</p></div><a class="button compact-link" th:href="@{/admin/herbs/new}">Add herb</a></div>
    <p class="notice success" th:if="${param.created}">Herb added.</p><p class="notice success" th:if="${param.updated}">Herb updated.</p><p class="notice success" th:if="${param.deleted}">Herb deleted.</p>
    <div class="table-wrap"><table class="catalogue-table"><thead><tr><th>Name</th><th>Category</th><th>Actions</th></tr></thead><tbody><tr th:each="herb : ${herbs}"><td th:text="${herb.name}">Herb</td><td th:text="${herb.categoryName}">Category</td><td class="table-actions"><a th:href="@{/admin/herbs/{id}/edit(id=${herb.id})}">Edit</a><form th:action="@{/admin/herbs/{id}/delete(id=${herb.id})}" method="post"><button type="submit" class="text-danger">Delete</button></form></td></tr></tbody></table></div>
</main>
</body>
</html>
